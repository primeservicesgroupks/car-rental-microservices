services:
  db:
    image: postgres:17
    container_name: car-rental-vehicle-db

    environment:
      POSTGRES_USER: vehicle_app
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: vehicle_rental

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - pg_vehicle_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U vehicle_app -d vehicle_rental
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_vehicle_data: